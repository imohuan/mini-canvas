<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>为什么卡 · 一分钟看懂</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#0f1115; color:#e6e9ef; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:10px 20px; background:#171a21; border-bottom:1px solid #2a2f3a; display:flex; align-items:center; gap:16px; flex-shrink:0; }
  header h1 { font-size:16px; font-weight:600; }
  header .tag { font-size:12px; color:#8a93a6; }
  #main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; position:relative; background: repeating-conic-gradient(#141720 0% 25%, #10131a 0% 50%) 0 0 / 32px 32px; overflow:hidden; }
  #panel { width:300px; background:#171a21; border-left:1px solid #2a2f3a; padding:14px; overflow-y:auto; flex-shrink:0; }
  #world { position:absolute; left:0; top:0; transform-origin:0 0; }
  .grp { position:absolute; border:3px solid #22d3ee; border-radius:12px; background:rgba(34,211,238,.05); }
  .grp .lbl { position:absolute; top:6px; left:10px; font-size:13px; color:#22d3ee; }
  .nd { position:absolute; width:90px; height:60px; border:2px solid #f59e0b; border-radius:8px; background:rgba(245,158,11,.12); font-size:11px; color:#fcd34d; display:flex; align-items:center; justify-content:center; text-align:center; }
  #vp { position:absolute; border:3px solid #ef4444; pointer-events:none; z-index:30; }
  #vp .lbl { position:absolute; top:4px; left:6px; font-size:12px; color:#ef4444; }
  #clipbox { position:absolute; border:2px dashed #64748b; z-index:5; pointer-events:none; }
  #clipbox .lbl { position:absolute; top:2px; left:6px; font-size:11px; color:#64748b; white-space:nowrap; }
  .badge { position:absolute; z-index:40; padding:6px 14px; border-radius:8px; font-size:13px; font-weight:600; }
  #modeBadge { top:14px; right:14px; }
  #fpsBadge { bottom:14px; right:14px; font-variant-numeric:tabular-nums; }
  .ok { background:rgba(52,211,153,.15); color:#34d399; border:1px solid #34d399; }
  .bad { background:rgba(248,113,113,.15); color:#f87171; border:1px solid #f87171; }
  .card { border:1px solid #2a2f3a; border-radius:10px; padding:12px; margin-bottom:12px; background:#1c2029; }
  .card h2 { font-size:13px; color:#cbd5e1; margin-bottom:8px; }
  .btn { display:block; width:100%; margin:6px 0; padding:9px; border-radius:8px; border:1px solid #2a2f3a; background:#262c38; color:#e6e9ef; font-size:13px; cursor:pointer; text-align:left; }
  .btn:hover { background:#303848; }
  .btn.active { background:#7c3aed; border-color:#7c3aed; }
  .explain { font-size:12px; color:#8a93a6; line-height:1.8; }
  .explain b { color:#e6e9ef; }
  .big { font-size:14px; color:#34d399; font-weight:600; }
  .switchrow { display:flex; align-items:center; justify-content:space-between; margin:6px 0; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>画布卡顿原理演示</h1>
  <span class="tag">拖空白处平移 · 滚轮缩放 · 右边三个按钮切换模式</span>
</header>
<div id="main">
  <div id="stage">
    <div id="world">
      <div class="grp" style="left:-600px;top:-500px;width:5200px;height:3400px">
        <span class="lbl">超大分组（5200 × 3400）</span>
      </div>
    </div>
    <div id="clipbox" style="display:none"><span class="lbl">contain:paint 的裁剪圈（钉在画布 0,0，不跟手）</span></div>
    <div id="vp"><span class="lbl">你的屏幕（视口）</span></div>
    <div class="badge" id="modeBadge">—</div>
    <div class="badge" id="fpsBadge">—</div>
  </div>
  <div id="panel">
    <div class="card">
      <h2>模式（点一下就切换）</h2>
      <button class="btn active" id="m0">① 现状：全部都画（卡）</button>
      <button class="btn" id="m1">② 只画屏幕里的（顺）</button>
      <button class="btn" id="m2">③ contain:paint 裁剪（错误示范）</button>
    </div>
    <div class="card">
      <h2>辅助显示</h2>
      <div class="switchrow"><span>显示裁剪圈（青色虚框）</span><input type="checkbox" id="showClip"></div>
    </div>
    <div class="card">
      <h2>这一屏发生了什么</h2>
      <div class="explain" id="note"></div>
    </div>
    <div class="card">
      <h2>一句话结论</h2>
      <div class="explain">
        <b>红框跟手，青框钉死</b>。② 的裁剪永远跟着红框走，所以永远对；
        ③ 的裁剪钉在青框上，红框一走开就裁错地方。<br><br>
        所以答案是 <b class="big">方案 ②</b>：我们自己算"屏幕里有哪些节点"，让浏览器只准备这些。
      </div>
    </div>
  </div>
</div>
<script>
const NODES = [
  { id:'n1', x:-500, y:-380, label:'左上角' },
  { id:'n2', x:-500, y:2620, label:'左下角' },
  { id:'n3', x:1100, y:900,  label:'中间' },
  { id:'n4', x:2400, y:1500, label:'右中' },
  { id:'n5', x:3700, y:2500, label:'右下' },
  { id:'n6', x:-1300, y:-900, label:'组外·远左上' },
  { id:'n7', x:1900, y:-700, label:'组外·上方' },
  { id:'n8', x:4300, y:2900, label:'组外·远右下' },
];
let vp = { x:520, y:420, zoom:0.32 };
let mode = 0;
let showClip = false;
const stage = document.getElementById('stage');
const world = document.getElementById('world');

for (const n of NODES) {
  const d = document.createElement('div');
  d.className = 'nd'; d.dataset.id = n.id;
  d.style.left = n.x+'px'; d.style.top = n.y+'px';
  d.textContent = n.label;
  world.appendChild(d);
}
document.getElementById('clipbox').style.cssText += ';left:0;top:0;width:1920px;height:911px;';

function visibleRect() {
  return { x:-vp.x/vp.zoom, y:-vp.y/vp.zoom, w:stage.clientWidth/vp.zoom, h:stage.clientHeight/vp.zoom };
}
const overlap = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
function expand(r,m){ return m? {x:r.x-m,y:r.y-m,w:r.w+2*m,h:r.h+2*m} : r; }

function draw() {
  world.style.transform = 'translate('+vp.x+'px,'+vp.y+'px) scale('+vp.zoom+')';
  const v = document.getElementById('vp');
  v.style.left='6px'; v.style.top='6px';
  v.style.width = (stage.clientWidth-12)+'px';
  v.style.height = (stage.clientHeight-12)+'px';
  document.getElementById('clipbox').style.display = showClip ? 'block' : 'none';

  const nodes = [...world.querySelectorAll('.nd')];
  let rendered = 0;
  if (mode === 0) {
    nodes.forEach(e => e.style.display = '');
    rendered = nodes.length;
  } else if (mode === 1) {
    const r = expand(visibleRect(), 300);
    nodes.forEach(e => {
      const n = NODES.find(x=>x.id===e.dataset.id);
      const vis = overlap({x:n.x,y:n.y,w:90,h:60}, r);
      e.style.display = vis ? '' : 'none';
      if (vis) rendered++;
    });
  } else {
    nodes.forEach(e => {
      const n = NODES.find(x=>x.id===e.dataset.id);
      const vis = overlap({x:n.x,y:n.y,w:90,h:60}, {x:0,y:0,w:1920,h:911});
      e.style.display = vis ? '' : 'none';
      if (vis) rendered++;
    });
  }
  const prepMs = rendered * 0.44 + 6;
  const fps = (1000/Math.max(prepMs,16.7)).toFixed(0);
  const mb = document.getElementById('modeBadge'), fb = document.getElementById('fpsBadge');
  if (mode===0){ mb.textContent='① 全画 '+rendered+' 个'; mb.className='badge bad'; }
  if (mode===1){ mb.textContent='② 自算剔除 · 画 '+rendered+' 个'; mb.className='badge ok'; }
  if (mode===2){ mb.textContent='③ contain:paint · 画 '+rendered+' 个（裁错）'; mb.className='badge bad'; }
  fb.textContent = '≈ '+prepMs.toFixed(0)+'ms/帧 · '+fps+' FPS';
  fb.className = 'badge ' + (prepMs<=20?'ok':'bad');
  const notes = {
    0: '所有节点都挂在工作台上。浏览器每帧要为 <b>全部 '+rendered+' 个</b>做"准备作业"（算样式/布局/滤镜），跟你看到几个无关 —— <b>这就是卡的原因</b>。',
    1: '判定框 = <b>红框 + 300 缓冲</b>（跟手）。屏幕外的节点连 DOM 都没有，浏览器只准备你看得见的 <b>'+rendered+' 个</b> —— 所以怎么拖都是满速。',
    2: '判定框 = <b>青色虚框</b>（钉死在画布 0,0，<b>不跟手</b>）。把红框拖到画布深处 —— 你眼前的节点全在青框外，<b>直接消失</b>。它裁的不是"屏幕"，是那个死框子。',
  };
  document.getElementById('note').innerHTML = notes[mode];
}

let panning=false, lx=0, ly=0;
document.addEventListener('pointerdown', e => {
  if (e.target.closest('#panel') || e.target.closest('.nd')) return;
  panning=true; lx=e.clientX; ly=e.clientY;
});
document.addEventListener('pointermove', e => {
  if (!panning) return;
  vp.x += e.clientX-lx; vp.y += e.clientY-ly;
  lx=e.clientX; ly=e.clientY;
  draw();
});
document.addEventListener('pointerup', () => panning=false);
document.addEventListener('wheel', e => {
  if (e.target.closest('#panel')) return;
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const k = e.deltaY<0 ? 1.12 : 1/1.12;
  const nz = Math.min(2, Math.max(0.05, vp.zoom*k));
  const ratio = nz/vp.zoom;
  vp.x = mx-(mx-vp.x)*ratio;
  vp.y = my-(my-vp.y)*ratio;
  vp.zoom = nz;
  draw();
}, {passive:false});

const btns = [document.getElementById('m0'), document.getElementById('m1'), document.getElementById('m2')];
btns.forEach((b,i)=> b.onclick = () => {
  mode = i;
  btns.forEach((x,j)=>x.classList.toggle('active', j===i));
  if (i===2) { showClip = true; document.getElementById('showClip').checked = true; }
  draw();
});
document.getElementById('showClip').onchange = e => { showClip = e.target.checked; draw(); };

draw();
</script>
</body>
</html>
