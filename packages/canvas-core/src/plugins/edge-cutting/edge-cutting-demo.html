<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edge Cutting Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101827;
      color: #e5e7eb;
      overflow: hidden;
    }
    .hud {
      position: fixed;
      z-index: 10;
      top: 16px;
      left: 16px;
      width: 360px;
      padding: 14px 16px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.86);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }
    .hud h1 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .hud p {
      margin: 6px 0;
      color: #b6c2d2;
      font-size: 13px;
      line-height: 1.5;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #1f2937;
      color: #cbd5e1;
      font-size: 12px;
    }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .status.active::before { background: #22c55e; }
    .controls {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .control-row input[type="color"] {
      width: 32px;
      height: 24px;
      padding: 1px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 6px;
      background: transparent;
    }
    .canvas {
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    .grid line { stroke: rgba(148, 163, 184, 0.14); }
    .node {
      fill: #182235;
      stroke: rgba(148, 163, 184, 0.55);
      stroke-width: 1.5;
      rx: 14;
    }
    .node-label {
      fill: #cbd5e1;
      font-size: 13px;
      pointer-events: none;
    }
    .edge {
      fill: none;
      stroke: #60a5fa;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.72;
      transition: stroke 160ms, opacity 160ms;
    }
    .edge.hit {
      stroke: #ef4444;
      opacity: 1;
    }
    .edge.removed {
      display: none;
    }
    .cut-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: visible;
      pointer-events: none;
      z-index: 20;
    }
    .cut-path {
      fill: none;
      stroke: var(--edge-cutting-path-color, #38bdf8);
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-opacity: 0.42;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 2px var(--edge-cutting-path-color, #38bdf8));
    }
    .blade-trail {
      fill: none;
      stroke: var(--edge-cutting-blade-color, #38bdf8);
      stroke-linecap: round;
      stroke-linejoin: round;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 3px var(--edge-cutting-blade-color, #38bdf8));
    }
    .blade-trail--wide {
      stroke-opacity: 0.13;
      stroke-width: 5;
    }
    .blade-trail--mid {
      stroke-opacity: 0.34;
      stroke-width: 2.4;
    }
    .blade-edge {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      mix-blend-mode: screen;
      filter:
        drop-shadow(0 0 2px rgba(255, 255, 255, 0.8))
        drop-shadow(0 0 4px var(--edge-cutting-blade-color, #38bdf8));
    }
    .blade-tip {
      fill: rgba(255, 255, 255, 0.88);
      stroke: var(--edge-cutting-blade-color, #38bdf8);
      stroke-width: 0.8;
      stroke-opacity: 0.5;
      filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.68));
    }
    .blade-spark {
      stroke: #ffffff;
      stroke-width: 0.8;
      stroke-linecap: round;
      opacity: 0.55;
      filter: drop-shadow(0 0 2px var(--edge-cutting-blade-color, #38bdf8));
    }
  </style>
</head>
<body>
  <section class="hud">
    <h1>连接线切割算法 demo</h1>
    <p>按住 <b>Alt</b> 后拖拽，绘制屏幕坐标切割线。松开鼠标后，和切割线相交或距离足够近的 SVG path 会被删除。</p>
    <p>滚轮默认缩放 demo 画布；Alt 模式下滚轮被禁止，用来模拟插件里禁止缩放。</p>
    <p>算法不解析 path 字符串，直接用浏览器的 <code>getTotalLength()</code> / <code>getPointAtLength()</code> 采样，天然兼容直线、贝塞尔、折线、圆角折线。</p>
    <div id="status" class="status">等待 Alt</div>
    <div class="controls">
      <label class="control-row">
        <span>显示绘制路径</span>
        <input id="showCutPath" type="checkbox" checked />
      </label>
      <label class="control-row">
        <span>路径颜色</span>
        <input id="pathColor" type="color" value="#38bdf8" />
      </label>
      <label class="control-row">
        <span>刀锋主题色</span>
        <input id="bladeColor" type="color" value="#38bdf8" />
      </label>
      <label class="control-row">
        <span>仅刀锋路径裁剪</span>
        <input id="bladeOnlyCut" type="checkbox" />
      </label>
    </div>
  </section>

  <svg id="cutLayer" class="cut-layer"></svg>

  <svg id="canvas" class="canvas">
    <defs>
      <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(148, 163, 184, 0.14)" stroke-width="1" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" />
    <g id="viewport" transform="translate(130 84) scale(1.25)">
      <rect class="node" x="40" y="70" width="120" height="64" />
      <text class="node-label" x="72" y="107">Source A</text>
      <rect class="node" x="520" y="58" width="120" height="64" />
      <text class="node-label" x="552" y="95">Target A</text>

      <rect class="node" x="70" y="260" width="120" height="64" />
      <text class="node-label" x="102" y="297">Source B</text>
      <rect class="node" x="530" y="282" width="120" height="64" />
      <text class="node-label" x="562" y="319">Target B</text>

      <path id="edge-straight" class="edge" data-label="straight" d="M 160 102 L 520 90" />
      <path id="edge-bezier" class="edge" data-label="bezier" d="M 160 292 C 300 292, 330 88, 520 90" />
      <path id="edge-step" class="edge" data-label="step" d="M 190 292 L 270 292 L 270 420 L 530 420 L 530 314" />
      <path id="edge-smoothstep" class="edge" data-label="smoothstep" d="M 160 102 L 260 102 Q 280 102 280 122 L 280 292 Q 280 314 302 314 L 530 314" />
    </g>
  </svg>

  <script>
    const svg = document.querySelector('#canvas')
    const viewport = document.querySelector('#viewport')
    const cutLayer = document.querySelector('#cutLayer')
    const statusEl = document.querySelector('#status')
    const showCutPathEl = document.querySelector('#showCutPath')
    const pathColorEl = document.querySelector('#pathColor')
    const bladeColorEl = document.querySelector('#bladeColor')
    const bladeOnlyCutEl = document.querySelector('#bladeOnlyCut')

    const state = {
      altDown: false,
      cutting: false,
      points: [],
      zoom: 1.25,
    }

    const config = {
      sampleStepPx: 6,
      hitTolerancePx: 8,
      minSamples: 24,
      showCutPath: true,
      pathColor: '#38bdf8',
      bladeColor: '#38bdf8',
      bladeOnlyCut: false,
    }

    function syncCutLayerViewport() {
      const width = window.innerWidth
      const height = window.innerHeight
      cutLayer.setAttribute('width', String(width))
      cutLayer.setAttribute('height', String(height))
      cutLayer.setAttribute('viewBox', `0 0 ${width} ${height}`)
    }

    function syncCutLayerTheme() {
      cutLayer.style.setProperty('--edge-cutting-path-color', config.pathColor)
      cutLayer.style.setProperty('--edge-cutting-blade-color', config.bladeColor)
    }

    function setStatus(text, active = false) {
      statusEl.textContent = text
      statusEl.classList.toggle('active', active)
    }

    function clientPoint(event) {
      return { x: event.clientX, y: event.clientY }
    }

    function distancePointToSegment(p, a, b) {
      const vx = b.x - a.x
      const vy = b.y - a.y
      const wx = p.x - a.x
      const wy = p.y - a.y
      const len2 = vx * vx + vy * vy
      const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, (wx * vx + wy * vy) / len2))
      const x = a.x + vx * t
      const y = a.y + vy * t
      return Math.hypot(p.x - x, p.y - y)
    }

    function ccw(a, b, c) {
      return (c.y - a.y) * (b.x - a.x) > (b.y - a.y) * (c.x - a.x)
    }

    function segmentsIntersect(a, b, c, d) {
      return ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d)
    }

    function segmentDistance(a, b, c, d) {
      if (segmentsIntersect(a, b, c, d)) return 0
      return Math.min(
        distancePointToSegment(a, c, d),
        distancePointToSegment(b, c, d),
        distancePointToSegment(c, a, b),
        distancePointToSegment(d, a, b),
      )
    }

    function pathPointToClient(path, distance) {
      const point = path.getPointAtLength(distance)
      const matrix = path.getScreenCTM()
      const domPoint = new DOMPoint(point.x, point.y).matrixTransform(matrix)
      return { x: domPoint.x, y: domPoint.y }
    }

    function samplePathInClientSpace(path) {
      const total = path.getTotalLength()
      const count = Math.max(config.minSamples, Math.ceil(total / config.sampleStepPx))
      return Array.from({ length: count + 1 }, (_, index) => {
        return pathPointToClient(path, total * index / count)
      })
    }

    function rectsOverlap(a, b) {
      return a.left <= b.right && a.right >= b.left && a.top <= b.bottom && a.bottom >= b.top
    }

    function visibleEdgePaths() {
      const canvasRect = svg.getBoundingClientRect()
      return [...document.querySelectorAll('.edge:not(.removed)')]
        .filter(path => rectsOverlap(path.getBoundingClientRect(), canvasRect))
    }

    function hitPathByCutLine(path, cutPoints) {
      if (cutPoints.length < 2) return false

      const pathPoints = samplePathInClientSpace(path)
      for (let i = 0; i < pathPoints.length - 1; i++) {
        for (let j = 0; j < cutPoints.length - 1; j++) {
          const distance = segmentDistance(pathPoints[i], pathPoints[i + 1], cutPoints[j], cutPoints[j + 1])
          if (distance <= config.hitTolerancePx) return true
        }
      }
      return false
    }

    function toPathData(points) {
      return points
        .map((p, index) => `${index === 0 ? 'M' : 'L'} ${p.x} ${p.y}`)
        .join(' ')
    }

    function addPath(className, pathData) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
      path.setAttribute('class', className)
      path.setAttribute('d', pathData)
      cutLayer.appendChild(path)
    }

    function addSpark(from, to, rotate = 1) {
      const dx = to.x - from.x
      const dy = to.y - from.y
      const len = Math.hypot(dx, dy) || 1
      const nx = -dy / len
      const ny = dx / len
      const sparkLength = 7
      const spark = document.createElementNS('http://www.w3.org/2000/svg', 'line')
      spark.setAttribute('class', 'blade-spark')
      spark.setAttribute('x1', String(to.x + nx * 1.6 * rotate))
      spark.setAttribute('y1', String(to.y + ny * 1.6 * rotate))
      spark.setAttribute('x2', String(to.x + nx * sparkLength * rotate - dx / len * 3))
      spark.setAttribute('y2', String(to.y + ny * sparkLength * rotate - dy / len * 3))
      cutLayer.appendChild(spark)
    }

    function drawCutLine() {
      syncCutLayerViewport()
      syncCutLayerTheme()
      cutLayer.innerHTML = ''
      if (!state.points.length) return

      const cutPath = toPathData(state.points)
      const trailPoints = state.points.slice(-12)
      const bladePoints = state.points.slice(-7)
      const trailPath = toPathData(trailPoints)
      const bladePath = toPathData(bladePoints)

      if (config.showCutPath && state.points.length > 1) addPath('cut-path', cutPath)
      addPath('blade-trail blade-trail--wide', trailPath)
      addPath('blade-trail blade-trail--mid', trailPath)
      addPath('blade-edge', bladePath)

      const lastPoint = state.points[state.points.length - 1]
      const prevPoint = state.points[state.points.length - 2] ?? lastPoint
      const tip = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
      tip.setAttribute('class', 'blade-tip')
      tip.setAttribute('cx', String(lastPoint.x))
      tip.setAttribute('cy', String(lastPoint.y))
      tip.setAttribute('r', '2.2')
      cutLayer.appendChild(tip)

      if (state.points.length > 2) {
        addSpark(prevPoint, lastPoint, 1)
        addSpark(prevPoint, lastPoint, -1)
      }
    }

    function commitCut() {
      const cutPoints = config.bladeOnlyCut ? state.points.slice(-7) : state.points
      const hits = visibleEdgePaths().filter(path => hitPathByCutLine(path, cutPoints))
      hits.forEach(path => path.classList.add('removed'))
      setStatus(hits.length ? `已删除 ${hits.length} 条连接线` : '没有命中连接线', false)
      window.setTimeout(() => { cutLayer.innerHTML = '' }, 180)
    }

    window.addEventListener('resize', syncCutLayerViewport)
    syncCutLayerViewport()
    syncCutLayerTheme()

    showCutPathEl.addEventListener('change', () => {
      config.showCutPath = showCutPathEl.checked
      drawCutLine()
    })
    pathColorEl.addEventListener('input', () => {
      config.pathColor = pathColorEl.value
      syncCutLayerTheme()
      drawCutLine()
    })
    bladeColorEl.addEventListener('input', () => {
      config.bladeColor = bladeColorEl.value
      syncCutLayerTheme()
      drawCutLine()
    })
    bladeOnlyCutEl.addEventListener('change', () => {
      config.bladeOnlyCut = bladeOnlyCutEl.checked
    })

    window.addEventListener('keydown', (event) => {
      if (event.key !== 'Alt') return
      state.altDown = true
      setStatus('Alt 切割模式：拖拽绘制切割线', true)
    })

    window.addEventListener('keyup', (event) => {
      if (event.key !== 'Alt') return
      state.altDown = false
      if (!state.cutting) setStatus('等待 Alt', false)
    })

    svg.addEventListener('pointerdown', (event) => {
      if (!state.altDown) return
      event.preventDefault()
      state.cutting = true
      state.points = [clientPoint(event)]
      svg.setPointerCapture(event.pointerId)
      drawCutLine()
    })

    svg.addEventListener('pointermove', (event) => {
      if (!state.cutting) return
      event.preventDefault()
      state.points.push(clientPoint(event))
      drawCutLine()
    })

    svg.addEventListener('pointerup', (event) => {
      if (!state.cutting) return
      event.preventDefault()
      state.cutting = false
      svg.releasePointerCapture(event.pointerId)
      commitCut()
    })

    svg.addEventListener('wheel', (event) => {
      event.preventDefault()
      if (state.altDown) return
      const nextZoom = Math.max(0.45, Math.min(2.4, state.zoom + (event.deltaY > 0 ? -0.08 : 0.08)))
      state.zoom = nextZoom
      viewport.setAttribute('transform', `translate(130 84) scale(${nextZoom})`)
      setStatus(`画布缩放：${nextZoom.toFixed(2)}x`, false)
    }, { passive: false })
  </script>
</body>
</html>
