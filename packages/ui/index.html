<!doctype html>
<!-- 默认暗色：在 <html> 上直接挂 dark class，避免首屏亮→暗闪一下。
     主题切换由 useUi().applyTheme() 增删这个 class（见 composables/ui.ts）。 -->
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@mini-canvas/ui — 画布应用</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234f7cff'/%3E%3Cpath d='M8 9h16v4H8zm0 7h10v4H8z' fill='white'/%3E%3C/svg%3E" />
    <style>
      /* 首屏底色走主题变量：index.html 在 CSS 加载前就生效，这里给暗色兜底，
         加载后由 --ui-canvas-bg / --ui-ink 接管（见 canvas-render/styles/ui-theme.css）。 */
      html, body, #app {
        height: 100%;
        margin: 0;
        background: var(--ui-canvas-bg, #141414);
        color: var(--ui-ink, #f7f7f7);
      }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
