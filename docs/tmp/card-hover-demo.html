<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plume · 卡片 hover 方案</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-soft: #fbfbfc;
    --ink: #18202b;
    --ink-dim: #6b7280;
    --ink-mute: #8c95a3;
    --line: #e2e5ea;
    --line-strong: #cfd5de;
    --hover: rgb(0 0 0 / .055);
    --hover-soft: rgb(0 0 0 / .03);
    --chip: rgb(0 0 0 / .07);
    --thumb: #eef0f4;
    --thumb-soft: #f2f4f7;
    --accent: #0891b2;
    --accent-ink: #0e7490;
    --accent-soft: rgb(8 145 178 / .12);
    --accent-ring: rgb(8 145 178 / .45);
    --shadow-sm: 0 1px 4px rgb(15 23 42 / .07);
    --shadow-md: 0 14px 32px -10px rgb(15 23 42 / .22);
    --shadow-lg: 0 22px 48px -14px rgb(15 23 42 / .30);
    --r-card: 16px;
    --r-thumb: 12px;
  }
  html.dark {
    --bg: #141414;
    --panel: #262626;
    --panel-soft: #171717;
    --ink: #f4f4f4;
    --ink-dim: #a3a3a3;
    --ink-mute: #868686;
    --line: #373737;
    --line-strong: #4d4d4d;
    --hover: rgb(255 255 255 / .10);
    --hover-soft: rgb(255 255 255 / .055);
    --chip: rgb(255 255 255 / .12);
    --thumb: #383838;
    --thumb-soft: #2a2a2a;
    --accent: #2cc0dd;
    --accent-ink: #7fdcef;
    --accent-soft: rgb(44 192 221 / .16);
    --accent-ring: rgb(44 192 221 / .55);
    --shadow-sm: 0 1px 4px rgb(0 0 0 / .55);
    --shadow-md: 0 16px 36px -10px rgb(0 0 0 / .65);
    --shadow-lg: 0 26px 56px -14px rgb(0 0 0 / .75);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 30px clamp(16px, 3vw, 46px) 80px;
    transition: background .2s, color .2s;
  }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -.01em; }
  h2 { font-size: 14px; margin: 0; }
  p { margin: 0; }
  .lead { max-width: 820px; color: var(--ink-dim); font-size: 13px; line-height: 1.75; }
  .lead b { color: var(--ink); }
  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 18px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--panel); box-shadow: var(--shadow-sm);
  }
  .bar .spacer { flex: 1; }
  .btn {
    height: 30px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: var(--hover); }
  .hint { font-size: 12px; color: var(--ink-dim); }
  .board {
    margin-top: 20px; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
  }
  .case {
    border: 1px solid var(--line); border-radius: 18px; background: var(--panel-soft);
    padding: 16px; min-width: 0;
  }
  .case-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .case-no {
    width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
    background: var(--add); color: #fff; font-size: 11px; font-weight: 800; flex: none;
  }
  .case-name { font-size: 14px; font-weight: 700; }
  .case-desc { flex-basis: 100%; font-size: 12px; color: var(--ink-dim); line-height: 1.6; margin-top: 2px; }
  .row {
    display: grid; gap: 14px; align-items: start;
    grid-template-columns: repeat(auto-fill, minmax(min(132px, 100%), 1fr));
  }
  .cap { margin-top: 8px; font-size: 11px; color: var(--ink-mute); text-align: center; }

  /* ===== 项目卡 ===== */
  .pcard {
    position: relative; display: flex; flex-direction: column; gap: 7px;
    border: 0; background: transparent; padding: 0; text-align: left;
    color: inherit; font: inherit; cursor: pointer; min-width: 0;
  }
  .pcard .thumb {
    position: relative; display: grid; place-items: center; overflow: hidden;
    aspect-ratio: 16 / 10; border-radius: var(--r-thumb);
    border: 1px solid var(--line);
    background: linear-gradient(150deg, var(--panel), var(--thumb-soft));
    transition: border-color .18s ease, box-shadow .22s ease, background .22s ease;
  }
  .pcard .thumb svg { width: 30px; height: 30px; color: var(--ink-mute); stroke-width: 1.25; position: relative; z-index: 1; transition: transform .22s ease, color .18s ease; }
  .pcard .nm { font-size: 13px; line-height: 1.4; padding: 0 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .dt { font-size: 11px; color: var(--ink-dim); padding: 0 1px; }
  .pcard .del {
    position: absolute; top: 7px; right: 7px; z-index: 6; width: 24px; height: 24px;
    display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 90%, transparent); color: var(--ink-dim);
    opacity: 0; transform: translateY(-3px); transition: opacity .15s, transform .15s, color .15s;
  }
  .pcard:hover .del { opacity: 1; transform: none; }
  .pcard .del:hover { color: var(--ink); background: var(--panel); }

  /* A 浮起 */
  .h-lift:hover .thumb { transform: translateY(-4px); border-color: var(--line-strong); box-shadow: var(--shadow-md); }
  .h-lift:hover .thumb svg { transform: scale(1.06); color: var(--ink-dim); }
  .h-lift:hover .nm { font-weight: 600; }

  /* B 缩略图放大 + 渐显遮罩 */
  .h-zoom .thumb::before {
    content: ""; position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg, transparent 40%, rgb(0 0 0 / .30));
    opacity: 0; transition: opacity .22s ease;
  }
  .h-zoom .thumb svg { transition: transform .3s cubic-bezier(.2,.7,.3,1); }
  .h-zoom:hover .thumb svg { transform: scale(1.18); color: var(--ink-dim); }
  .h-zoom:hover .thumb::before { opacity: 1; }
  .h-zoom .open {
    position: absolute; left: 9px; right: 9px; bottom: 8px; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: #fff; opacity: 0; transform: translateY(6px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .h-zoom:hover .open { opacity: 1; transform: none; }
  .h-zoom:hover .thumb { border-color: var(--line-strong); }

  /* C 描边聚光 */
  .h-glow .thumb::after {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(120% 100% at 50% 0%, var(--accent-soft), transparent 68%);
    opacity: 0; transition: opacity .22s ease;
  }
  .h-glow:hover .thumb { border-color: var(--accent-ring); box-shadow: 0 0 0 3px var(--accent-soft); }
  .h-glow:hover .thumb::after { opacity: 1; }
  .h-glow:hover .thumb svg { color: var(--accent-ink); transform: translateY(-2px); }
  .h-glow:hover .nm { color: var(--accent-ink); font-weight: 600; }

  /* D 底部操作条浮出 */
  .h-bar .thumb { border-radius: var(--r-thumb); }
  .h-bar .thumb::before {
    content: ""; position: absolute; inset: 0; z-index: 2;
    background: color-mix(in srgb, var(--panel) 55%, transparent);
    opacity: 0; transition: opacity .2s ease;
  }
  .h-bar:hover .thumb::before { opacity: 1; }
  .h-bar .actions {
    position: absolute; left: 50%; top: 50%; z-index: 4; transform: translate(-50%, -40%);
    display: flex; gap: 6px; opacity: 0; transition: opacity .2s ease, transform .2s ease;
  }
  .h-bar:hover .actions { opacity: 1; transform: translate(-50%, -50%); }
  .h-bar .actions span {
    height: 26px; padding: 0 11px; border-radius: 8px; display: inline-flex; align-items: center;
    background: var(--panel); border: 1px solid var(--line); font-size: 11px; font-weight: 600;
    box-shadow: var(--shadow-sm); white-space: nowrap;
  }
  .h-bar .actions .go { background: var(--accent); border-color: transparent; color: #fff; }
  .h-bar:hover .thumb { border-color: var(--line-strong); }

  /* 演示：固定 hover 态 */
  .demo-hover .del { opacity: 1; transform: none; }
  .h-lift.demo-hover .thumb { transform: translateY(-4px); border-color: var(--line-strong); box-shadow: var(--shadow-md); }
  .h-lift.demo-hover .thumb svg { transform: scale(1.06); color: var(--ink-dim); }
  .h-lift.demo-hover .nm { font-weight: 600; }
  .h-zoom.demo-hover .thumb::before { opacity: 1; }
  .h-zoom.demo-hover .thumb svg { transform: scale(1.18); color: var(--ink-dim); }
  .h-zoom.demo-hover .open { opacity: 1; transform: none; }
  .h-zoom.demo-hover .thumb { border-color: var(--line-strong); }
  .h-glow.demo-hover .thumb { border-color: var(--accent-ring); box-shadow: 0 0 0 3px var(--accent-soft); }
  .h-glow.demo-hover .thumb::after { opacity: 1; }
  .h-glow.demo-hover .thumb svg { color: var(--accent-ink); transform: translateY(-2px); }
  .h-glow.demo-hover .nm { color: var(--accent-ink); font-weight: 600; }
  .h-bar.demo-hover .thumb::before { opacity: 1; }
  .h-bar.demo-hover .actions { opacity: 1; transform: translate(-50%, -50%); }
  .h-bar.demo-hover .thumb { border-color: var(--line-strong); }

  /* ===== 抽屉宫格卡 ===== */
  .drawer-demo {
    width: 100%; max-width: 360px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel-soft); overflow: hidden;
  }
  .dd-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .dd-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .dd-body { padding: 8px; }
  .dgrid { display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
  .ncard {
    position: relative; display: flex; flex-direction: column; gap: 6px;
    padding: 4px 4px 9px; border: 0; border-radius: 13px; background: transparent;
    color: inherit; font: inherit; cursor: pointer; text-align: left; min-width: 0;
  }
  .ncard .box {
    position: relative; display: grid; place-items: center; aspect-ratio: 1;
    border-radius: 11px; border: 1px solid var(--line); background: var(--thumb-soft);
    overflow: hidden; transition: border-color .18s, box-shadow .2s, background .2s;
  }
  .ncard .box svg { width: 26px; height: 26px; color: var(--ink-mute); stroke-width: 1.3; transition: transform .22s, color .18s; position: relative; z-index: 1; }
  .ncard .cap2 { font-size: 12px; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* A 浮起 */
  .n-lift:hover { background: var(--hover-soft); }
  .n-lift:hover .box { transform: translateY(-3px); border-color: var(--line-strong); box-shadow: var(--shadow-md); }
  .n-lift:hover .box svg { transform: scale(1.08); color: var(--ink-dim); }
  .n-lift.demo-hover { background: var(--hover-soft); }
  .n-lift.demo-hover .box { transform: translateY(-3px); border-color: var(--line-strong); box-shadow: var(--shadow-md); }
  .n-lift.demo-hover .box svg { transform: scale(1.08); color: var(--ink-dim); }

  /* B 描边光 */
  .n-glow:hover .box { border-color: var(--accent-ring); box-shadow: 0 0 0 2px var(--accent-soft); }
  .n-glow:hover .box svg { color: var(--accent-ink); }
  .n-glow:hover .cap2 { color: var(--accent-ink); font-weight: 600; }
  .n-glow.demo-hover .box { border-color: var(--accent-ring); box-shadow: 0 0 0 2px var(--accent-soft); }
  .n-glow.demo-hover .box svg { color: var(--accent-ink); }
  .n-glow.demo-hover .cap2 { color: var(--accent-ink); font-weight: 600; }

  /* C 缩略图放大 */
  .n-zoom .box svg { transition: transform .32s cubic-bezier(.2,.7,.3,1); }
  .n-zoom .box::after {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(100% 100% at 50% 30%, var(--accent-soft), transparent 72%);
    opacity: 0; transition: opacity .22s;
  }
  .n-zoom:hover .box svg { transform: scale(1.3); color: var(--accent-ink); }
  .n-zoom:hover .box::after { opacity: 1; }
  .n-zoom.demo-hover .box svg { transform: scale(1.3); color: var(--accent-ink); }
  .n-zoom.demo-hover .box::after { opacity: 1; }

  /* D 操作角标 */
  .n-more .more {
    position: absolute; right: 5px; top: 5px; z-index: 3; width: 20px; height: 20px;
    border-radius: 6px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line);
    font-size: 12px; color: var(--ink-dim); opacity: 0; transform: translateY(-3px);
    transition: opacity .15s, transform .15s;
  }
  .n-more:hover .more { opacity: 1; transform: none; }
  .n-more:hover .box { border-color: var(--line-strong); box-shadow: var(--shadow-md); }
  .n-more:hover { background: var(--hover-soft); }
  .n-more.demo-hover .more { opacity: 1; transform: none; }
  .n-more.demo-hover .box { border-color: var(--line-strong); box-shadow: var(--shadow-md); }
  .n-more.demo-hover { background: var(--hover-soft); }

  @media (max-width: 980px) { .board { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <h1>卡片 hover 方案（4 选 1）</h1>
  <p class="lead">
    每个方案里第二张卡是<b>固定悬停态</b>，方便对比；把鼠标移到其它卡上也是真实效果。
    卡片外观本身不加装饰，只改<b>悬停时</b>的反应。选好后告诉我编号（例如「项目卡 B + 抽屉 C」），我照着改代码。
  </p>

  <div class="bar">
    <button class="btn" id="themeBtn">切换暗色</button>
    <button class="btn" id="replayBtn">重播悬停</button>
    <span class="hint">悬停效果：抬起 / 放大 / 描边发光 / 操作浮出，四种取向</span>
    <span class="spacer"></span>
    <span class="hint">窄屏自适应已一并做好</span>
  </div>

  <div class="board" id="board"></div>

  <script>
    const folder = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 6.8a2 2 0 0 1 2-2h3.9l1.9 2h7.8a2 2 0 0 1 2 2v8.4a2 2 0 0 1-2 2H5.2a2 2 0 0 1-2-2z"/></svg>';
    const image = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>';
    const text = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5h14M12 5v14M8 19h8"/></svg>';
    const trash = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>';

    const projectCases = [
      { id: 'A', name: '浮起', desc: '卡片轻微上抬 + 柔和投影，图标略放大。最克制，像把卡片从桌面上拿起来一点。' },
      { id: 'B', name: '缩略图放大', desc: '图片放大、底部压深色渐变，浮出「打开 ↗」。信息量最大，适合有真实缩略图的项目。' },
      { id: 'C', name: '描边聚光', desc: '青色细描边 + 顶部淡光晕，名字变主题色。最明确地表达「我被选中/可点」。' },
      { id: 'D', name: '操作浮出', desc: '整块蒙一层薄纱，中间浮出「打开 / 更多」按钮。动作最直接，但视觉最重。' },
    ];
    const nodeCases = [
      { id: 'A', name: '浮起', desc: '卡底微亮、缩略图上抬 3px 加阴影，名字不动。适合抽屉这种小卡片。' },
      { id: 'B', name: '描边光', desc: '青色描边 + 淡淡外发光，名字同步变青。与画布里的「选中」语言一致。' },
      { id: 'C', name: '图案放大', desc: '缩略图里的图标放大 1.3 倍并加淡青底光，卡片本身不位移。' },
      { id: 'D', name: '操作角标', desc: '右上角浮出「⋯」菜单按钮，整卡背景微亮。适合以后要加右键/更多操作。' },
    ];

    function projectCard(cls, i, demo) {
      const names = ['我的项目', '确认框测试', '发布确认测试'];
      const extra = cls === 'h-zoom'
        ? '<span class="open"><span>打开项目</span><span>↗</span></span>'
        : cls === 'h-bar'
          ? '<span class="actions"><span class="go">打开</span><span>更多</span></span>'
          : '';
      return '<button class="pcard ' + cls + (demo ? ' demo-hover' : '') + '">' +
        '<span class="thumb">' + folder + extra + '</span>' +
        '<span class="del" title="删除">' + trash + '</span>' +
        '<span class="nm">' + names[i] + '</span>' +
        '<span class="dt">2026-11-0' + (5 + i) + '</span></button>';
    }

    function nodeCard(cls, label, icon, demo) {
      const more = cls === 'n-more' ? '<span class="more">⋯</span>' : '';
      return '<button class="ncard ' + cls + (demo ? ' demo-hover' : '') + '">' + more +
        '<span class="box">' + icon + '</span><span class="cap2">' + label + '</span></button>';
    }

    const board = document.getElementById('board');
    board.innerHTML =
      '<section class="case" style="--add:var(--accent)">' +
        '<div class="case-head"><span class="case-no">项</span><span class="case-name">项目卡片 hover</span>' +
        '<span class="case-desc">同一套房子里比较四种反应。竖排是「静止 / 悬停 / 悬停」。</span></div>' +
        '<div style="display:grid;gap:18px">' +
          projectCases.map((c) =>
            '<div><div class="case-head" style="margin-bottom:8px"><span class="case-no">' + c.id + '</span>' +
            '<span class="case-name">' + c.name + '</span><span class="case-desc">' + c.desc + '</span></div>' +
            '<div class="row">' + [0,1,2].map((i) => projectCard('h-' + ({A:'lift',B:'zoom',C:'glow',D:'bar'})[c.id], i, i === 1)).join('') + '</div></div>'
          ).join('') +
        '</div></section>' +
      '<section class="case" style="--add:#8b5cf6">' +
        '<div class="case-head"><span class="case-no">抽</span><span class="case-name">抽屉宫格卡 hover</span>' +
        '<span class="case-desc">抽屉里的卡更小，动作要轻；第二张是固定悬停态。</span></div>' +
        '<div style="display:grid;gap:18px">' +
          nodeCases.map((c) =>
            '<div><div class="case-head" style="margin-bottom:8px"><span class="case-no">' + c.id + '</span>' +
            '<span class="case-name">' + c.name + '</span><span class="case-desc">' + c.desc + '</span></div>' +
            '<div class="drawer-demo"><div class="dd-head"><span class="dot"></span><span>画布 1 · 分组 1</span><span style="margin-left:auto;color:var(--ink-dim)">3 个节点</span></div>' +
            '<div class="dd-body"><div class="dgrid">' +
              nodeCard('n-' + ({A:'lift',B:'glow',C:'zoom',D:'more'})[c.id], '文本', text, false) +
              nodeCard('n-' + ({A:'lift',B:'glow',C:'zoom',D:'more'})[c.id], '图片', image, true) +
              nodeCard('n-' + ({A:'lift',B:'glow',C:'zoom',D:'more'})[c.id], '视频', image, false) +
            '</div></div></div></div>'
          ).join('') +
        '</div></section>';

    document.getElementById('themeBtn').addEventListener('click', (e) => {
      const dark = document.documentElement.classList.toggle('dark');
      e.target.textContent = dark ? '切换亮色' : '切换暗色';
    });
    document.getElementById('replayBtn').addEventListener('click', () => {
      document.querySelectorAll('.pcard, .ncard').forEach((el) => {
        el.style.transition = 'none';
        el.offsetHeight;
        el.style.transition = '';
      });
    });
  </script>
</body>
</html>
